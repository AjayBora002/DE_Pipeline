version: 2

models:
  - name: silver_weather
    columns:
      - name: date
        tests: [not_null, unique]
      - name: temp_avg_c
        tests: [not_null]

  - name: silver_ridership
    columns:
      - name: trip_id
        tests: [not_null, unique]
      - name: duration_minutes
        tests: [not_null]

  - name: gold_daily_summary
    columns:
      - name: date
        tests: [not_null, unique]
      - name: total_rides
        tests: [not_null]